<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My RV Video</title>

    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .video-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }

        /* ===== AMBIENT GLOW CANVAS ===== */
        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80%;
            height: 80%;
            transform: translate(-50%, -50%) scale(1.2);
            filter: blur(60px) brightness(0.7);
            pointer-events: none;
            z-index: 0;
            opacity: 0.9;
            border-radius: 50%;
        }

        /* ===== MAIN VIDEO ===== */
        .video-container {
            position: relative;
            z-index: 2;
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-container .plyr {
            height: 100%;
            width: auto;
        }

        .video-container .plyr__video-wrapper {
            height: 100% !important;
            background: transparent !important;
        }

        .video-container video {
            height: 100% !important;
            width: auto !important;
            object-fit: contain !important;
        }

        /* ===== CTA BUTTON ===== */
        .cta-wrapper {
            position: absolute;
            bottom: 100px;
            right: 30px;
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            pointer-events: none;
        }

        .cta-wrapper.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .cta-button {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 30px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 60px;
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s ease;
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.3);
        }

        .cta-button:hover {
            transform: scale(1.05);
        }

        .cta-button::before {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: 60px;
            padding: 3px;
            background: conic-gradient(from 0deg, #00ffc8, #00d4ff, #7b2ffc, #ff6fd8, #00ffc8);
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rotateBorder 3s linear infinite;
            pointer-events: none;
        }

        .cta-button::after {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: 60px;
            background: conic-gradient(from 0deg, rgba(0, 255, 200, 0.4), rgba(0, 212, 255, 0.4), rgba(123, 47, 252, 0.4), rgba(255, 111, 216, 0.4), rgba(0, 255, 200, 0.4));
            background-size: 300% 300%;
            filter: blur(20px);
            animation: rotateBorder 3s linear infinite;
            opacity: 0.6;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes rotateBorder {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .cta-price {
            color: #00ffc8;
            font-size: 24px;
        }
        .cta-phone-icon {
            font-size: 28px;
        }
        .cta-label {
            color: #fff;
            font-weight: 600;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .video-container {
                height: 80vh;
            }
            .cta-wrapper {
                bottom: 80px;
                right: 50%;
                transform: translateX(50%) translateY(20px);
                width: 90%;
                max-width: 320px;
            }
            .cta-wrapper.visible {
                transform: translateX(50%) translateY(0);
            }
            .cta-button {
                width: 100%;
                justify-content: center;
                padding: 14px 20px;
                font-size: 18px;
            }
            .cta-price {
                font-size: 20px;
            }
            .cta-phone-icon {
                font-size: 24px;
            }
            .cta-label {
                font-size: 14px;
            }
            .ambient-glow {
                filter: blur(50px) brightness(0.6);
                width: 90%;
                height: 90%;
            }
        }

        @media (max-width: 480px) {
            .video-container {
                height: 70vh;
            }
            .cta-wrapper {
                bottom: 70px;
            }
            .cta-button {
                padding: 12px 16px;
                font-size: 16px;
            }
            .cta-price {
                font-size: 18px;
            }
            .ambient-glow {
                filter: blur(40px) brightness(0.5);
            }
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <!-- ===== AMBIENT GLOW CANVAS ===== -->
        <canvas id="ambientCanvas" class="ambient-glow"></canvas>

        <!-- ===== MAIN VIDEO ===== -->
        <div class="video-container">
            <video id="player" controls playsinline>
                <source src="myvideo.mp4" type="video/mp4" />
                Your browser does not support the video tag.
            </video>
        </div>

        <!-- ===== CTA BUTTON ===== -->
        <div class="cta-wrapper" id="ctaWrapper">
            <button class="cta-button" id="ctaButton">
                <span class="cta-price">$19.5k</span>
                <span class="cta-phone-icon">📞</span>
                <span class="cta-label">Call Now</span>
            </button>
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <script>
        // =============================================
        // 1. INITIALIZE PLYR
        // =============================================
        const player = new Plyr('#player', {
            controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'fullscreen'],
            autoplay: false,
            muted: false
        });

        // =============================================
        // 2. AMBIENT CANVAS GLOW (Color Sampling)
        // =============================================
        const canvas = document.getElementById('ambientCanvas');
        const ctx = canvas.getContext('2d');
        const mainVideo = document.querySelector('#player');
        let animationFrame = null;
        let isCanvasReady = false;

        function resizeCanvas() {
            // Small canvas = minimal CPU usage (we only need blurry colors)
            const size = 64;
            canvas.width = size;
            canvas.height = size;
            isCanvasReady = true;
        }
        resizeCanvas();

        function updateAmbientGlow() {
            if (!isCanvasReady || mainVideo.readyState < 2) {
                animationFrame = requestAnimationFrame(updateAmbientGlow);
                return;
            }

            // Draw the current video frame onto the tiny canvas
            ctx.drawImage(mainVideo, 0, 0, canvas.width, canvas.height);

            // Continue sampling every frame (but the canvas is tiny, so it's cheap)
            animationFrame = requestAnimationFrame(updateAmbientGlow);
        }

        // Start the glow when the video plays
        player.on('play', () => {
            if (!animationFrame) {
                updateAmbientGlow();
            }
        });

        player.on('pause', () => {
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
        });

        // Capture a frame when the user seeks
        player.on('seeked', () => {
            if (mainVideo.readyState >= 2) {
                ctx.drawImage(mainVideo, 0, 0, canvas.width, canvas.height);
            }
        });

        // Initial capture when metadata loads
        player.on('loadedmetadata', () => {
            resizeCanvas();
            if (mainVideo.readyState >= 2) {
                ctx.drawImage(mainVideo, 0, 0, canvas.width, canvas.height);
            }
        });

        // Also draw a frame when the user clicks play (in case it was paused)
        player.on('playing', () => {
            if (mainVideo.readyState >= 2) {
                ctx.drawImage(mainVideo, 0, 0, canvas.width, canvas.height);
            }
        });

        // =============================================
        // 3. CTA BUTTON TIMING (10 SECONDS LEFT)
        // =============================================
        const ctaWrapper = document.getElementById('ctaWrapper');
        let ctaShown = false;

        player.on('loadedmetadata', () => {
            ctaShown = false;
            ctaWrapper.classList.remove('visible');
        });

        player.on('timeupdate', () => {
            if (ctaShown) return;
            const duration = player.duration;
            const currentTime = player.currentTime;
            const threshold = duration > 15 ? duration - 10 : 5;

            if (currentTime >= threshold && !ctaShown) {
                ctaShown = true;
                ctaWrapper.classList.add('visible');
            }
        });

        // =============================================
        // 4. CTA BUTTON: SAVE CONTACT AS vCard
        // =============================================
        document.getElementById('ctaButton').addEventListener('click', function() {
            const vcardData = `BEGIN:VCARD
        VERSION:3.0
        FN:Past Owner of My RV
        TEL;TYPE=CELL:6022816259
        END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'Past_Owner_of_My_RV.vcf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 100);

            const btn = this;
            const originalText = btn.innerHTML;
            btn.innerHTML = '✅ Saved!';
            setTimeout(() => btn.innerHTML = originalText, 2500);
        });

        console.log('🎬 Ambient Glow active – colors from video fill the empty space!');
    </script>
</body>
</html>
